gui:
  mainMenu:
    title: "Dragon Management"
    buttons:
      customize:
        name: "§bDragon Customization" # Added color code for emphasis
        lore:
          - "§7Change your active dragon's type"
          - "§7(Fire, Ice, or Lightning)"
      storage:
        name: "§aDragon Egg Storage" # Added color code
        lore:
          - "§7Store and retrieve your dragon eggs."
          - "§7Current eggs: §e{0}§7/§e{1}" # Added color codes
      buyEgg:
        name: "§6Buy Dragon Egg" # Added color code
        lore:
          - "§7Purchase a new dragon egg."
          - "§7Price: §e${0}" # Added color code
          - "§7You have: §e{1}§7/§e{2} §7eggs" # Added color codes
        max:
          - "§cYou already have the maximum" # Added color code
          - "§cnumber of dragon eggs (§e{0}§c)." # Added color code
      lostEgg:
        name: "§cReport Lost Egg" # Added color code
        lore:
          - "§7If you lost a dragon egg,"
          - "§7report it here to remove it."
      help:
        name: "§eDragon Help" # Added color code
        lore:
          - "§7Information about dragons"
          - "§7and how to use them."
  customization:
    title: "Dragon Customization"
    buttons:
      type:
        fire: "§cFire Dragon" # Added color code
        fire_lore:
          - "§7Click to change your dragon"
          - "§7into a §cFire Dragon§7."
        ice: "§bIce Dragon" # Added color code
        ice_lore:
          - "§7Click to change your dragon"
          - "§7into an §bIce Dragon§7."
        lightning: "§eLightning Dragon" # Added color code
        lightning_lore:
          - "§7Click to change your dragon"
          - "§7into a §eLightning Dragon§7."
      # Removed effects/color as they might not be implemented or needed based on user request focus
      back:
        name: "§fBack" # Added color code
        lore:
          - "§7Return to the main menu."
      default_lore: "§7Click to go back" # Generic lore for default back button
    next: # New section for next button
      name: "§aNext"
      default_lore: "§7Click to go to the next page"
  storage:
    title: "Dragon Egg Storage"
    buttons:
      back:
        name: "§fBack" # Added color code
        lore:
          - "§7Return to the main menu."
      help:
        name: "§eHelp" # Added color code
        lore:
          - "§7Store your dragon eggs safely here."
          - "§7Maximum §e{0} §7eggs."
          - "§7Click an egg in the storage to retrieve it."
          - "§7Click an egg in your inventory to store it." # Clarified action
    messages:
      saved: "§aDragon egg storage saved!" # Added color code
      loaded: "§aDragon egg storage loaded!" # Added color code
      stored: "§aDragon egg stored successfully!" # Added message
      retrieved: "§aDragon egg retrieved successfully!" # Added message
      storageFull: "§cYour egg storage is full!" # Added message
      notYourEgg: "§cYou can only store your own dragon eggs!" # Added message
  purchaseMenu:
    title: "Dragon Egg Purchase"
    info:
      name: "§dDragon Egg" # Added color code
      lore:
        - "§7Purchase a new dragon egg."
        - "§7The dragon's type will be determined"
        - "§7by how you incubate the egg."
        - ""
        - "§7Price: §e{0} §7coins" # Added color code
    buttons:
      confirm:
        name: "§aConfirm Purchase" # Added color code
        lore:
          - "§7Click to confirm the purchase"
          - "§7and receive your new egg."
      cancel:
        name: "§cCancel" # Added color code
        lore:
          - "§7Click to cancel the purchase"
          - "§7and return to the main menu."

