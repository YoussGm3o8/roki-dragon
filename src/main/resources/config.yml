# RokiDragon Configuration File
# -----------------------------
# Configure various aspects of the RokiDragon plugin.

# Language settings for plugin messages
language:
  default: "en_US"  # Default language file to load from the 'lang' folder (e.g., en_US.yml)
  fallback: "en_US" # Fallback language if the default file is missing or invalid

# Economy related settings
economy:
  dragon_egg_price: 128000 # Cost to purchase a dragon egg via the GUI/command

# Timing and Cooldown settings
timing:
  # Egg incubation settings
  eggs:
    incubation_time_seconds: 3600 # Time in seconds for an egg to hatch while incubating (Default: 3600 = 1 hour)

  # Cooldowns for various actions
  cooldowns:
    buy_seconds: 60          # Cooldown in seconds between purchasing eggs (Default: 60)
    respawn_seconds: 900     # Cooldown in seconds before a dragon can be summoned after death (Default: 900 = 15 minutes)
    ability_milliseconds: 2000 # Cooldown in milliseconds between using dragon abilities (e.g., fireball) (Default: 500) - INCREASED TO 2 SECONDS
    summon_seconds: 30       # Cooldown in seconds after summoning a dragon before it can be used again (Default: 30)
  
  # Dragon despawn settings
  despawn_delay_seconds: 300 # Time in seconds before a dragon despawns after player dismounts (Default: 300 = 5 minutes)

# World restrictions
world_restrictions:
  enabled: true              # Set to false to disable world restrictions entirely
  allowed_worlds:            # List of worlds where dragon commands and features can be used
    - "world"                # Default world name (usually "world" in Nukkit)
    # Add more world names as needed

# Dragon entity base statistics
dragon_stats:
  max_health: 100         # Maximum health points (integer, Default: 100)
  base_damage: 15.0       # Base damage dealt by attacks (Default: 15.0) - Currently not implemented
  damage_reduction: 0.25  # Damage reduction multiplier (0.0 = no reduction, 1.0 = full immunity, Default: 0.25 = 75% reduction)
  move_speed: 1.8         # Base movement speed (Default: 1.8)
  max_speed: 0.92         # Maximum flight speed (Default: 0.92)
  ice_dragon_fire_vulnerability: 1.5 # Damage multiplier for Ice Dragons taking fire/lava damage (Default: 1.5 = 50% extra damage)

# Flight physics settings
flight_physics:
  acceleration_rate: 0.08        # How quickly dragons accelerate (Default: 0.08)
  drag_coefficient: 0.025        # How quickly dragons naturally slow down (Default: 0.025)
  gravity_accel: 0.04            # Constant downward pull (Default: 0.04)
  dive_accel_multiplier: 1.2     # Extra acceleration multiplier when diving (Default: 1.2)
  lift_coefficient: 0.05         # Upward force generated by forward motion (Default: 0.05)
  max_vertical_speed_up: 1.0     # Maximum upward velocity (Default: 1.0)
  max_vertical_speed_down: -2.0  # Maximum downward velocity (negative value) (Default: -2.0)
  min_lift_speed: 0.2            # Minimum speed needed to generate lift (Default: 0.2)
  flat_flight_speed_multiplier: 1.5 # Speed multiplier for level flight (Default: 1.5)
  pitch_threshold_down: 20       # Pitch angle to trigger dive effects (Default: 20 degrees)
  pitch_threshold_flat: 15       # Pitch threshold for flat/level flight (Default: 15 degrees)
  pitch_threshold_up: -20        # Pitch threshold for upward flight (Default: -20 degrees)

# Visual effect settings
visual:
  particle_effect_interval_ticks: 5 # How often particle effects are displayed (Default: 5 ticks)
  death_particle_count: 20         # Number of particles created when dragon dies (Default: 20)

# Dragon entity settings
dragon_settings:
  dismount_resistance_duration_ticks: 100 # Duration of resistance effect when dismounting (Default: 100 ticks = 5 seconds)
  dismount_resistance_amplifier: 254      # Strength of resistance effect (Default: 254 = max resistance)
  min_name_length: 3                      # Minimum length for dragon names (Default: 3)
  max_name_length: 16                     # Maximum length for dragon names (Default: 16)

# Settings for specific dragon abilities
abilities:
  # Fireball ability (used by Fire Dragon)
  fireball:
    explosion_radius: 3.0 # Size of the explosion (Default: 3.0)
    set_fire: true        # Whether fireballs should set blocks on fire (Default: true)
    fire_chance: 0.3333   # Chance for blocks to catch fire (0.0 to 1.0, Default: 0.3333)
    # fire_trail: true    # Whether fireballs should have particle trail effects (Default: true) - Consider making configurable

  # Iceball ability (used by Ice Dragon)
  iceball:
    freeze_duration_ticks: 100 # Duration of slowness effect in ticks (20 ticks = 1 second, Default: 100 = 5 seconds)
    freeze_amplifier: 1      # Amplifier for slowness effect (0 = Slowness I, 1 = Slowness II, etc., Default: 1)
    snow_radius: 3           # Radius for placing snow layers on impact (Default: 3)
    snow_chance: 0.7         # Chance to place snow layer on valid blocks (0.0 to 1.0, Default: 0.7)

  # Lightning Ball ability (used by Lightning Dragon)
  lightning_ball:
    explosion_radius: 1.2 # Size of the explosion (Default: 1.2)
    # summon_lightning: true # Whether to summon actual lightning on impact (Default: true) - Consider making configurable

  # Water Ball ability (used by Water Dragon)
  waterball:
    splash_radius: 3       # Radius of water splash effects (Default: 3)
    slowness_duration_ticks: 80 # Duration of slowness effect in ticks (20 ticks = 1 second, Default: 80 = 4 seconds)
    slowness_amplifier: 1   # Amplifier for slowness effect (0 = Slowness I, 1 = Slowness II, etc., Default: 1)
    water_chance: 50        # Chance to create temporary water blocks (percentage, Default: 50%)
    create_water: true      # Whether to create temporary water blocks on impact (Default: true)

  # Earth Ball ability (used by Earth Dragon)
  earthball:
    explosion_radius: 2.0    # Size of the explosion effect (Default: 2.0)
    slowness_duration_ticks: 60 # Duration of slowness effect in ticks (20 ticks = 1 second, Default: 60 = 3 seconds)
    slowness_amplifier: 2    # Amplifier for slowness effect (0 = Slowness I, 1 = Slowness II, etc., Default: 2)
    stone_chance: 30         # Chance to create temporary stone blocks (percentage, Default: 30%)
    create_stone: true       # Whether to create temporary stone blocks on impact (Default: true)

  # Item required to use dragon abilities (Format: "minecraft:item_id" or just "item_id")
  required_shoot_item:
    fire: "minecraft:fire_charge" # Default: Fire Charge
    ice: "minecraft:snowball"     # Default: Snowball
    lightning: "minecraft:glowstone_dust" # Default: Glowstone Dust

# Dragon Naming Rules
naming:
  min_length: 3 # Minimum allowed length for a dragon's name (Default: 3)
  max_length: 16 # Maximum allowed length for a dragon's name (Default: 16)

# GUI Settings (Example - Add more as needed)
gui:
  storage_size: 5 # Maximum number of eggs a player can store in the management GUI (Default: 5)
